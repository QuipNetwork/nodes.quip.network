@version: 4.2
# Merged stack log. Every compose service forwards here through the Docker
# `syslog` logging driver, which connects from the HOST daemon — not from the
# compose network — so the listener binds 0.0.0.0 inside the container and the
# compose file publishes it on 127.0.0.1 only.
#
# UDP, not TCP, on purpose: the syslog driver aborts container startup when a
# TCP endpoint refuses the connection, which would make this collector a hard
# dependency of the whole stack. UDP costs dropped lines instead.
source s_net {
    # so-rcvbuf raises the kernel UDP receive buffer for this socket, which
    # narrows (but does not eliminate) line loss under a burst. It is capped
    # by net.core.rmem_max -- see README's Logs section.
    udp(ip("0.0.0.0") port(5514) so-rcvbuf(8388608));
};

# owner/group/perm are required. syslog-ng creates files root:root 0600 by
# default, which makes the bind-mounted log unreadable to the host operator.
# Backticks are syslog-ng's environment-variable expansion, evaluated against
# PUID/PGID so the merged file is owned by whatever uid/gid docker-compose.yml
# passes in (via the x-runtime-user anchor), not a hardcoded default. There is
# NO fallback if they are unset, so anything starting this container directly
# (outside compose) must export PUID and PGID itself.
destination d_merged {
    file("/logs/quip-node.log"
         owner(`PUID`) group(`PGID`) perm(0644)
         # Any local process can send a datagram here (see README), so an
         # attacker-controlled MESSAGE could otherwise forge extra lines that
         # impersonate another service. Replacing CR and LF is what prevents
         # that: a record confined to one physical line cannot become two.
         #
         # The options are narrow on purpose. A bare $(sanitize ${MESSAGE})
         # also rewrites "/" and every control character to "_", which mangles
         # every URL and path the stack logs and collapses Caddy's
         # tab-delimited console format, so a 502 reads as an ordinary line to
         # any reader that keys on those tabs. --no-ctrl-chars keeps the tabs,
         # and naming CR and LF explicitly keeps the line-injection guard.
         #
         # Use single quotes around the set. '\n\r' processes the escapes,
         # while "\n\r" is taken literally as the characters \, n and r: it
         # rewrites every r and n in the message and stops guarding newlines.
         template("${ISODATE} ${PROGRAM} $(sanitize --no-ctrl-chars --invalid-chars '\n\r' ${MESSAGE})\n"));
};

log { source(s_net); destination(d_merged); };
