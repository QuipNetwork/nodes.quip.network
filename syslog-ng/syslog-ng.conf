@version: 4.2
# Merged stack log. Every compose service forwards here through the Docker
# `syslog` logging driver, which connects from the HOST daemon — not from the
# compose network — so the listener binds 0.0.0.0 inside the container and the
# compose file publishes it on 127.0.0.1 only.
#
# UDP, not TCP, on purpose: the syslog driver aborts container startup when a
# TCP endpoint refuses the connection, which would make this collector a hard
# dependency of the whole stack. UDP costs dropped lines instead.
source s_net {
    udp(ip("0.0.0.0") port(5514));
};

# owner/group/perm are required. syslog-ng creates files root:root 0600 by
# default, which makes the bind-mounted log unreadable to the host operator.
# Backticks are syslog-ng's environment-variable expansion, evaluated against
# PUID/PGID so the merged file is owned by whatever uid/gid docker-compose.yml
# passes in (via the x-runtime-user anchor), not a hardcoded default. There is
# NO fallback if they are unset, so anything starting this container directly
# (outside compose) must export PUID and PGID itself.
destination d_merged {
    file("/logs/quip-node.log"
         owner(`PUID`) group(`PGID`) perm(0644)
         template("${ISODATE} ${PROGRAM} ${MESSAGE}\n"));
};

log { source(s_net); destination(d_merged); };
